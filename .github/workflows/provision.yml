name: Provision server

# One-time (idempotent) server setup, run manually from the Actions tab.
# Installs the stack, clones the app, and runs deploy/provision.sh over SSH.
# Uses the same secrets as Deploy: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH,
# and optionally SSH_PORT.

on:
  workflow_dispatch:

concurrency:
  group: provision-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Provision over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            command -v git >/dev/null 2>&1 || { apt-get update -y && apt-get install -y git; }
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              mkdir -p "$(dirname "${{ secrets.DEPLOY_PATH }}")"
              git clone https://github.com/Tresto2025/Whatsapp_product.git "${{ secrets.DEPLOY_PATH }}"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main
            chmod +x deploy/provision.sh
            bash deploy/provision.sh
